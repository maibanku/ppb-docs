components:
  securitySchemes:
    consoleSession:
      type: apiKey
      in: cookie
      name: file_console_session
      description: 个人BFF会话，file_console专用
    adminSession:
      type: apiKey
      in: cookie
      name: file_admin_session
      description: 平台管理会话与数据范围鉴权
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: service access token
      description: 限定audience/client/application/scope；可叠加mTLS
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          description: FILE错误码
        message:
          type: string
          description: 可显示的错误
        request_id:
          type: string
          description: 追踪ID
      required:
      - code
      - message
      - request_id
    Empty:
      type: object
      additionalProperties: false
      properties: {}
    File:
      type: object
      additionalProperties: false
      properties:
        file_biz_key:
          type: string
          description: 不透明稳定业务键，兼容存量格式
          minLength: 1
          maxLength: 64
        original_name:
          type: string
          description: 名称
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          description: 实际字节
        detected_mime:
          type: string
          description: 真实类型
        file_status:
          type: string
          description: 状态
          enum:
          - verifying
          - ready
          - recycled
          - purge_pending
          - purged
          - failed
        restriction_status:
          type: string
          description: 平台限制
          enum:
          - normal
          - blocked
        create_time:
          type: string
          description: RFC3339
          format: date-time
        update_time:
          type: string
          description: RFC3339
          format: date-time
        revision_number:
          type: integer
          format: int64
          minimum: 1
          description: 重命名与状态更新CAS版本
      required:
      - file_biz_key
      - original_name
      - size_bytes
      - file_status
      - restriction_status
      - revision_number
    FilePage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/File'
        next_cursor:
          type: string
          description: 不透明游标，空表示结束
      required:
      - items
      - next_cursor
    Quota:
      type: object
      additionalProperties: false
      properties:
        used_bytes:
          type: integer
          format: int64
          minimum: 0
          description: 包含回收站
        reserved_bytes:
          type: integer
          format: int64
          minimum: 0
          description: 预留
        recycled_bytes:
          type: integer
          format: int64
          minimum: 0
          description: used子集
        quota_bytes:
          type: integer
          format: int64
          minimum: 0
          description: 生效上限，零禁止
        quota_biz_key:
          type: string
          description: 不透明稳定业务键，兼容存量格式
          minLength: 1
          maxLength: 64
        revision_number:
          type: integer
          minimum: 1
      required:
      - used_bytes
      - reserved_bytes
      - recycled_bytes
      - quota_bytes
      - quota_biz_key
      - revision_number
    InitUpload:
      type: object
      additionalProperties: false
      properties:
        original_name:
          type: string
          description: 文件名
          minLength: 1
          maxLength: 256
        declared_bytes:
          type: integer
          format: int64
          minimum: 1
          description: 声明大小，完成再验
        declared_mime:
          type: string
          description: 参考类型
          maxLength: 128
        upload_mode:
          type: string
          description: auto由政策决定
          enum:
          - auto
          - direct_put
          - multipart
      required:
      - original_name
      - declared_bytes
      - upload_mode
    InternalInitUpload:
      type: object
      additionalProperties: false
      properties:
        original_name:
          type: string
          description: 文件名
          minLength: 1
          maxLength: 256
        declared_bytes:
          type: integer
          format: int64
          minimum: 1
          description: 声明大小，完成再验
        declared_mime:
          type: string
          description: 参考类型
          maxLength: 128
        upload_mode:
          type: string
          description: auto由政策决定
          enum:
          - auto
          - direct_put
          - multipart
        application_biz_key:
          type: string
          description: 不透明稳定业务键，兼容存量格式
          minLength: 1
          maxLength: 64
        uploader_user_id:
          type: string
          description: 雪花ID十进制字符串
          pattern: ^[0-9]+$
        quota_biz_key:
          type: string
          description: 不透明稳定业务键，兼容存量格式
          minLength: 1
          maxLength: 64
        workspace_biz_key:
          type: string
          description: 不透明稳定业务键，兼容存量格式
          minLength: 1
          maxLength: 64
      required:
      - original_name
      - declared_bytes
      - upload_mode
      - application_biz_key
      - quota_biz_key
    SignedPart:
      type: object
      additionalProperties: false
      properties:
        part_number:
          type: integer
          format: int64
          minimum: 1
          description: 从1开始
        upload_url:
          type: string
          description: 短期敏感URL，不持久化
          format: uri
        required_headers:
          type: object
          additionalProperties:
            type: string
        expire_time:
          type: string
          description: URL截止
          format: date-time
      required:
      - part_number
      - upload_url
      - required_headers
      - expire_time
    Upload:
      type: object
      additionalProperties: false
      properties:
        upload_biz_key:
          type: string
          description: 不透明稳定业务键，兼容存量格式
          minLength: 1
          maxLength: 64
        upload_mode:
          type: string
          description: 模式
          enum:
          - direct_put
          - multipart
        upload_status:
          type: string
          description: 会话状态
          enum:
          - ongoing
          - completing
          - done
          - aborting
          - aborted
          - expired
          - failed
        part_size:
          type: integer
          format: int64
          minimum: 0
          description: direct为0
        part_count:
          type: integer
          format: int64
          minimum: 0
          description: direct为0
        expire_time:
          type: string
          description: 会话截止
          format: date-time
        file_biz_key:
          type: string
          description: 不透明稳定业务键，兼容存量格式
          minLength: 1
          maxLength: 64
        direct_upload_url:
          type: string
          description: direct模式短期PUT URL，其他模式省略
          format: uri
        required_headers:
          type: object
          additionalProperties:
            type: string
      required:
      - upload_biz_key
      - upload_mode
      - upload_status
      - part_size
      - part_count
      - expire_time
    SignParts:
      type: object
      additionalProperties: false
      properties:
        part_numbers:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: integer
            minimum: 1
      required:
      - part_numbers
    SignedParts:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SignedPart'
      required:
      - items
    Part:
      type: object
      additionalProperties: false
      properties:
        part_number:
          type: integer
          format: int64
          minimum: 1
          description: 分片号
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          description: 后端实测
        provider_etag:
