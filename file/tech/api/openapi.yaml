openapi: 3.0.3
info:
  title: PPB File Platform API
  version: 0.1.0-design
  description: 拟实施v2控制面契约；不是已上线API。包含个人BFF、服务间和管理面，部署须分离暴露范围。大文件字节通过后端生成的对象存储URL传输。媒体接口P0.1，HLS包管理API留待P1完整定义。所有修改请求带Idempotency-Key；Cookie修改请求另需CSRF。
servers:
- url: https://file.example.invalid
  description: 仅示例；internal路径不得暴露公网
paths:
  /api/v2/file/files:
    get:
      operationId: fileV2001
      summary: 列个人文件（file_console）
      description: 授权、幂等与生命周期语义见接口契约.md。
      tags:
      - 个人工作台
      security:
      - consoleSession: []
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum:
                    - FILE-0000
                  request_id:
                    type: string
                    description: 追踪ID
                  data:
                    $ref: '#/components/schemas/FilePage'
                required:
                - code
                - request_id
                - data
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
